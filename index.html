<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>危险品知识题库 · 在线答题</title>
<style>
:root{
  --primary:#1a56c4; --primary-dark:#173e88; --bg:#f0f4fb; --card:#fff;
  --ok:#16a34a; --bad:#dc2626; --muted:#6b7280; --border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1e293b;min-height:100vh}
header{background:linear-gradient(135deg,#173e88,#1a56c4);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.85;font-weight:400}
.userbox{display:flex;align-items:center;gap:10px;font-size:14px}
.userbox .btn{
  background:#fff;color:var(--primary);border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.userbox .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.container{max-width:960px;margin:0 auto;padding:20px 16px 60px}
/* tabs */
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);transition:.15s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .badge{display:inline-block;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;margin-left:5px}
.card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:16px}
.sec-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--primary-dark)}
/* login */
.auth-wrap{max-width:420px;margin:40px auto}
.auth-card{background:var(--card);border-radius:16px;padding:32px;box-shadow:0 6px 24px rgba(0,0,0,.08);border:1px solid var(--border)}
.auth-card h2{font-size:22px;margin-bottom:4px;color:var(--primary-dark)}
.auth-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-size:14px;outline:none}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,196,.15)}
.btn-main{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}
.btn-main:hover{background:var(--primary-dark)}
.link{font-size:13px;color:var(--primary);cursor:pointer;text-align:center;margin-top:12px}
.msg{font-size:13px;min-height:18px;margin-top:10px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
/* setup */
.setup-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.mode-chip{padding:9px 16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;background:#fff;color:var(--muted)}
.mode-chip.active{border-color:var(--primary);color:var(--primary);background:#eef3fc}
.sel-count{width:90px;padding:9px;border:1px solid var(--border);border-radius:9px;font-size:14px;text-align:center}
/* quiz */
.qmeta{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.qbadge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.qbadge.judge{background:#fef3c7;color:#92400e}
.qbadge.choice{background:#dbeafe;color:#1e40af}
.qtext{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:18px}
.opt{margin:8px 0}
.opt label{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-size:15px;line-height:1.5;transition:.12s;background:#fff}
.opt label:hover{border-color:var(--primary)}
.opt input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}
.opt.correct label{border-color:var(--ok);background:#f0fdf4}
.opt.wrong label{border-color:var(--bad);background:#fef2f2}
.result-box{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;line-height:1.7}
.result-box.correct{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.result-box.wrong{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.ghost{background:#e2e8f0;color:#334155}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{font-size:13px;color:var(--primary);font-weight:700}
/* wrong list */
.wrong-item{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
.wrong-item .wq{font-size:15px;font-weight:600;margin:8px 0 12px;line-height:1.6}
.wrong-item .wmeta{font-size:12px;color:var(--muted)}
.center{text-align:center}
.empty{color:var(--muted);font-size:15px;padding:30px 0;text-align:center}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{padding:18px;border-radius:12px;text-align:center;background:#f8fafc;border:1px solid var(--border)}
.stat .num{font-size:30px;font-weight:800;color:var(--primary)}
.stat .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}


/* ===== iOS Safari 兼容（老版本 Safari 不支持 flex gap） ===== */
@supports not (gap: 1px){
  header>*{margin-right:10px;margin-bottom:4px}
  header>*:last-child{margin-right:0}
  .userbox>*{margin-right:10px}
  .userbox>*:last-child{margin-right:0}
  .tabs>*{margin:0 8px 8px 0}
  .tabs>*:last-child{margin-right:0}
  .setup-row>*{margin-right:10px;margin-bottom:8px}
  .setup-row>*:last-child{margin-right:0}
  .actions>*{margin-right:10px;margin-top:0}
  .actions>*:last-child{margin-right:0}
  .opt label>*{margin-right:10px}
}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,button{font-size:16px}
input.sel-count{-webkit-appearance:none;appearance:none;text-align:center}
</style>

quipment)中可能含有哪些危险品？", "options": [["A", "易燃固体"], ["B", "湿电池"], ["C", "毒性物质"], ["D", "开关盒或电子管内可能含有磁性物质或汞（磁性材料）"]], "answer": "BD", "type": "选择", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节电气设备/电子设备ELECTRICAL EQUIPMENT/ELECTRONIC EQUIPMENT可能含磁性材料或在开关装置和电子管中的汞、湿电池、锂电池或燃料电池或含有装过燃料的燃料电池盒。"}, {"id": 29, "question": "当在美国运行的航班出现紧急情况时,飞行机组只需将公司的应急电话号码报告给当地ATC,由ATC负责与公司应急电话联系,获得危险品的装载及处置有关信息", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 30, "question": "对于旅客行李中的危险品,哪些需要以机长通知单的形式通知当班机长", "options": [["A", "气象局携带的水银温度计"], ["B", "满足收运条件的子弹"], ["C", "锂电池驱动的电动轮椅"], ["D", "免维护型湿电池,即防漏型电池(电池可以拆下)"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 31, "question": "第七类放射性物质不需要与下列哪种物质进行隔离", "options": [["A", "种蛋"], ["B", "活体动物"], ["C", "未冲洗的胶卷"], ["D", "食品"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 32, "question": "飞行中如果客舱内出现危险物品的不安全事故，在飞机着陆后，乘务员应该", "options": [["A", "填写《客舱记录本》"], ["B", "和专业人员一起处理危险物品"], ["C", "组织旅客离开飞机后再请专业人员对危险品进行处理"], ["D", "向地面工作人员指明危险物品及其存放的地点"]], "answer": "ACD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 33, "question": "飞行中，如危险品发生泄露，须将清理后的危险品放入聚乙烯袋子中，并可将其放在飞机最低风险区", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 34, "question": "飞行中客舱内危险物品不安全事故客舱乘务组检查单可以在国航的《机上危险物品事故应急处理手册》中查找", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 35, "question": "符合包装的液氮可以手提或者运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "装有冷冻液氮的保温包装（干式液氮罐）：能完全被多孔材料吸收的液氮保温包装件，用于运输非危险品（可以手提也可以托运）"}, {"id": 36, "question": "放射性物质分为三个放射等级,I 级的放射性物质危害性最大", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "I级放射性物质 Ti=0 白色标识II级放射性物质  0<Ti≤1 黄色标识 III级放射性物质  1<Ti≤10 黄色标识"}, {"id": 37, "question": "飞行人员应遵循危险品不安全事故检查单,处置与危险品运输相关的事故与事故征候", "options ", "救生器材"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 47, "question": "国航危险品事故／征候现场处置措施包括（）", "options": [["A", "以上都包括"], ["B", "危险品识别"], ["C", "立即作出应急反应"], ["D", "撤离并确定安全区域"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 48, "question": "国航接收自北京始发的烟花爆竹", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "运输符合IATA《危险品规则》要求的1-9类的危险品中，但不运输：\n从中国始发的烟花爆竹"}, {"id": 49, "question": "国航可接收含有液体危险品的单一包装（包括复合包装）", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 50, "question": "国航的客机航班上可以运输 A 级感染性物质", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 51, "question": "国航规定,每名旅客和机组成员所允许携带的酒精饮料(浓度大于24%,小于70%)的总量为", "options": [["A", "5升"], ["B", "10升"], ["C", "2升"], ["D", "2.5升"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "在零售包装内体积浓度大于24%但不超过70%的酒精饮料，每个容器体积不能超过5升，并且每人可携带的总量不得超过5升"}, {"id": 52, "question": "国航危险品事故/症候应急处置最基本的原则是保护旅客和机组人员的人身安全", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 53, "question": "根据《机上危检物品事故应急处理手册》中的应急处置措施表，解释12FZ的含义：", "options": [["A", "天火程序为使用所有可用的灭火剂，如可用，使用水"], ["B", "Z表示货触灭火系统可能无法扑灭或抑制火情，考虑尽快着陆"], ["C", "对航空器的威胁是起火和／或爆炸"], ["D", "固有危险为起火，高温，烟，有毒和易燃蒸汽"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 54, "question": "根据危险品所具有的危险程度不同，危险品划分为三个包装等级，从 I 级包装到 III级包装危险程度递减", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "表示危险品的危险性大小和包装的严格程度：I级包装 危险性较大，II级包装 危险性中等，III级包装 危险性较小"}, {"id": 55, "question": "根据危险品所具有的不同类型危险性质，危险品分为九大类", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "危险品分类1-9类"}, {"id": 56, "question": "根据运输内容的不同，机长通知单分为特殊装载机长通知单（行李）、危险品货物机长通知单、贵重物品机长通知单三种", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断" ", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 89, "question": "某放射性物质的Ti值为9, 其属于第（）级放射性物质。", "options": [["A", "III"], ["B", "II"], ["C", "I"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "I级放射性物质 Ti=0 白色标识II级放射性物质  0<Ti≤1 黄色标识 III级放射性物质  1<Ti≤10 黄色标识"}, {"id": 90, "question": "满足包装要求的液氮包装件可以作为手提或托运行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 91, "question": "《民用航空危险品运输管理规定》是中国政府危险品航空运输管理的主要法规之一。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 92, "question": "满足一定要求的鸟类,鱼类标本可以作为手提或托运行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 93, "question": "每位旅客可以携带一支水银温度计，且只能作为托运行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 94, "question": "哪些属于易燃气体？", "options": [["A", "丁烷"], ["B", "灭火器"], ["C", "丙烷"], ["D", "氧气"], ["E", "乙炔"]], "answer": "ACE", "type": "选择", "source": "file2_全部", "note": "易燃气体RFG（例：丁烷（打火机），氢气，丙烷，乙炔"}, {"id": 95, "question": "内装电池的便携式电子设备中的备用电池，每名旅客或机组人员最多可以携带（）块，超过应通知国航，经国航同意后方可运输，", "options": [["A", "2"], ["B", "20"], ["C", "15"], ["D", "8"]], "answer": "B", "type": "选择", "source": "file2_全部", "note": "2.备用电池（包括干电池，镍氢电池，密封性湿电池和锂电池）每人最多20块，超出需国航同意\n3.备用锂电池每人最多携带8块"}, {"id": 96, "question": "内装锂电池的便携式电子设备，每名旅客或机组人员最多可以携带（）个，超过应通知国航，经国航同意后方可运输。", "options": [["A", "2"], ["B", "15"], ["C", "8"], ["D", "20"]], "answer": "B", "type": "选择", "source": "file2_全部", "note": "1.锂电池驱动的电子设备每人最多15台，超出数量限制需国航同意"}, {"id": 97, "question": "OPCW 的工作人员经国航同意可以将含有少量放射性物质的设备作为手提行李带入客舱", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 98, "question": "汽车、汽车零部件（Automobiles、Automobiles parts)中可能含有哪些危险品？", "options": [["A", "轮胎充气设备中的压缩气体"], ["B", "燃油"], ["C", "气囊组件"], ["D", "磁性物质"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节汽车可能含有虽不符合对磁性物质的定义，但由于可能影响航空器仪器而需符合特殊装载要求的铁磁性材料。也可能含发动机、包括燃料电池发动机、化油器或含有装过燃料的燃料箱、湿电池或锂电池、轮胎充气装置中的压缩气体、灭火器、含氮震台架/支柱、安全气囊充气器/安全气囊模块、易燃黏合剂、油漆、密封剂和溶剂等"}, {"id": 99, "question": "汽车和飞机发动机不属于危险品", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节汽车可能含有虽不符合对磁性物质的定义，但由于可能影响航空器仪器而需符合特殊装载要求的铁磁性材料。也可能含发动机、包括燃料电池发动机、化油器或含有装过燃料的燃料箱、湿电池或锂电池、轮胎充气装置中的压缩气体、灭火器、含氮震台架/支柱、安全气囊充气器/安全气囊模块、易燃黏合剂、油漆、密封剂和溶剂等"}, {"id": 100, "question": "潜水灯具可以作为旅客的手提行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 101, "question": "潜水设备里可能含有 2.2 项非易燃无毒气体", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节潜水设备DIVING EQUIPMENT可能含压缩气瓶（空气、氧气等）如自携式潜水呼吸氧气桶、背心气瓶等。也可能含强光潜水等，当在空气中启动时可能产生极高的热量。为安全载运，灯泡或电池必须保持断路。"}, {"id": 102, "question": "请选择属于遇水释放易燃气体的物质。", "options": [["A", "铝金属"], ["B", "钠金属"], ["C", "锂金属"], ["D", "碳化钙"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": "遇水释放易燃气体的物质RFW（例：氧化钙，钠金属，锂金属）"}, {"id": 103, "question": "请选择属于毒性物质 RPB 的物质。", "options": [["A", "氰化钾"], ["B", "砷"], ["C", "尼古丁"], ["D", "患者标本"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": "毒性物质RPB（例：砷，尼古丁，氰化物，农药，马钱子碱（老鼠药））"}, {"id": 104, "question": "请判断以下物质是否属于第 9 类危险品。", "options": [["A", "干冰"], ["B", "汽车"], ["C", "锂电池"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": "第九类《杂项危险物质和物品，包括危害环境的物质》RMD\n例：危害环境的物质，高温物质，磁性物质，干冰，汽车，锂电池等"}, {"id": 105, "question": "请判断以下表述是否正确？第7类放射性物质分为3个放射性等级，放射等级最危险的Ⅲ级。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "I级放射性物质 Ti=0 白色标识II级放射性物质  0<Ti≤1 黄色标识 III级放射性物质  1<Ti≤10 黄色标识"}, {"id": 106, "question": "如被危险品接触了身体和衣服，应（）。", "options": [["A", "用大量水冲洗身体，并脱掉被污染的衣服"], ["B", "寻求医疗救助"], ["C", "不要吃东西或吸烟"], ["D", "以上均需"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 107, "question": "如果已知怀疑的危险物品以粉末的形式泄漏，乘务员应该采取行动", "options": [["A", "所有物品均应保持原位不动"], ["B", "将该区域隔离起来，直到着陆"], ["C", "用聚乙烯袋子或其他塑料袋子和毛毯覆盖该区域"], ["D", "不要使用灭火剂或水"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 108, "question": "如果旅客携带的便携式电子装置在飞机客舱内起火，乘务员应立即使用海伦灭火瓶扑灭火情，防止火势蔓延，接下来的行动步骤正确的有", "options": [["A", "在剩余的飞行时间里对装置及其周围区域进行监测，以确保装置不构成进一步的风险"], ["B", "必须使用水（或其他不可燃液体）使起火的电池冷却，防止热扩散到电池中的其他电池"], ["C", "在装置冷却 10---15 分钟后，采取防护措施将其置于容器中并将其完全浸在水里，并将"], ["D", "将装置放在原位，并检测重新发火现象"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 109, "question": "如果已知怀疑的危险品以粉末的形式泄露，乘务员应采取（）行动。", "options": [["A", "所有物品均应保持原位不动"], ["B", "用聚乙烯袋子或其他塑料袋和毛毯覆盖该区域"], ["C", "将该区域隔离起来，直到着陆。"], ["D", "不要使用灭火剂或水"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 110, "question": "如果已知电池的标称电压（V）和标称容量（Ah）,可以通过计算得到额定瓦特小时的数值，其公式为：Wh=V×Ah", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "锂离子电池用额定瓦特小时（Wh）。它是一种规范的锂离子电池的计量标准\n电池的标称电压（V）和标称容量（Ah）\n计算额定瓦特小时的数值：Wh=V x Ah\n电池上只标记有毫安时（mAh），可以将该数值除以1000得到安培小时（Ah）"}, {"id": 111, "question": "使用锂离子电池(可拆卸)驱动的电动代步工具,锂离子电池可以作为托运行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 112, "question": "如果锂电池按照危险品货物运输应该按照第九类危险品运输", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "锂电池属于第九类"}, {"id": 113, "question": "如果危险品装入集装器运输,货物组装完毕后应在集装器上拴挂集装器挂牌", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 114, "question": "如果在飞行中发生紧急情况,机长将按规定通知有关当局,通知事项如下", "options": [["A", "UN编号"], ["B", "运输专用名称"], ["C", "危险品的数量"], ["D", "装载位置"], ["E", "以上所有"]], "answer": "E", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 115, "question": "容易燃烧或摩擦容易起火的固体,属于以下哪类", "options": [["A", "class 4"], ["B", "DIV.4.1"], ["C", "DIV.4.2"]], "answer": "B", "type": "选择", "source": "file2_全部", "note": "4.1项 易燃固体RFS（例：红磷（火柴），硫磺，塞璐璐）"}, {"id": 116, "question": "RPB是哪类危险品的操作代码", "options": [["A", "毒性物质"], ["B", "感染性物质"], ["C", "毒性气体"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "6.1项 毒性物质RPB"}, {"id": 117, "question": "缩语RNG的含义是（）。", "options": [["A", "易燃气体"], ["B", "深冷液化气体"], ["C", "毒性气体"], ["D", "非易燃无毒气体"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": "2.2项 非易燃无毒气体RNG"}, {"id": 118, "question": "摄影用品可能含有哪些危险品？", "options": [["A", "热发生装置"], ["B", "易燃液体"], ["C", "易燃固体"], ["D", "氧化性物质"], ["E", "有机过氧化物"], ["F", "毒性或腐蚀性物质"]], "answer": "ABCDEF", "type": "选择", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节摄影或媒体设备FILM CREW OR MEDIA EQUIPMENT可能含有爆炸性烟火装置、内燃发动机、湿电池、锂电池、燃料、发热物品等"}, {"id": 119, "question": "赛璐璐材质的乒乓球属于（）。", "options": [["A", "遇水释放易燃气体的物质"], ["B", "爆炸品"], ["C", "毒性物质"], ["D", "易燃固体"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": "4.1项 易燃固体RFS（例：红磷（火柴），硫磺，塞璐璐）"}, {"id": 120, "question": "属于毒性气体的物质是（）。", "options": [["A", "氢气"], ["B", "氯气"], ["C", "二氧化碳"], ["D", "氨气"]], "answer": "B", "type": "选择", "source": "file2_全部", "note": "2.3项 毒性气体RPG（例：低毒性的气溶胶，催泪装置）"}, {"id": 121, "question": "体育用弹药在满足运输条件的情况下，可以作为托运行李运输，每人每件携带毛重不超过（）", "options": [["A", "4干克"], ["B", "2. 5干克"], ["C", "1干克"], ["D", "5千克"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 122, "question": "托运行李中携带用作制冷剂的干冰,每位旅客最大允许重量为", "options": [["A", "2.5kg"], ["B", "5kg"], ["C", "4kg"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "经承运人同意，当用于不受本规则限制的易腐物品的保鲜时，每位旅客可携带不超过2.5千克的干冰作为托运或手提行李，但包装件要留有通气孔；如作托运行李，需在行李上标注出“二氧化碳”或“干冰”，并标记干冰净重或干冰重量不超过2.5千克"}, {"id": 123, "question": "“UN”代表什么？", "options": [["A", "联合国规格标记"], ["B", "某种物质的标记"], ["C", "某类危险品的标记"], ["D", "企业标记"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "UN代表联合国规格标记"}, {"id": 124, "question": "为了诊断或治疗需要植入人体的含有放射性物质的心脏起搏器属于第 7 类危险品", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 125, "question": "危险物品没有分项的是", "options": [["A", "CLASS 2 4 7 8"], ["B", "CLASS 1 3 7 8"], ["C", "CLASS 2 3 8 9"], ["D", "CLASS 3 7 8 9"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": "没有分项的危险品是第3、7、8、9类"}, {"id": 126, "question": "危险品的识别标记包括以下哪些内容？", "options": [["A", "运输专用名称"], ["B", "UN 编号"], ["C", "托运人名称和地址"], ["D", "收货人名称和地址"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 127, "question": "危险品包装识别标记包括（）", "options": [["A", "运输专用名称"], ["B", "UN 编号"], ["C", "收货人名称和地址"], ["D", "物品净重"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 128, "question": "危险品包装识别标记只包括运输专用名称和UN编号。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 129, "question": "危险品是指在航空运输中，能对健康、安全、财产或环境构成危险，并在《技术细则》的危险品表中列明和根据此规则进行分类的物品或物质", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 130, "question": "危险品必须填写危险品货物机长通知单（公司另有规定的除外），且必须在航班起飞前尽早与机长交接，并将危险品货物机长通知单上的有关信息在航班起飞前报载重平衡部门", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 131, "question": "危险品货物机长通知单的保存期限为 1 年", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "《危险品货物机长通知单》保存期限为3年"}, {"id": 132, "question": "危险品违规行为指不构成危险品事故或事故征候，但与危险品航空运输有关，违反 276部或《技术细则》的行为，包括但不限于旅客行李中夹带禁止携带的危险品，瞒报谎报危险品运输、危险品货物错误粘贴标签等", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 133, "question": "危险品事故是指与危险品航空运输有关联，不一定发生在航空器上，但造成人员受伤、财产损失、环境污染、起火、破损、溢出液体或放射性物质渗漏或包装未能保持完好的其它情况", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "危险品征候：是指不同于危险品事故，但与危险品航空运输有关联，不一定发生在航空器上，但造成人员受伤、财产损坏或者破坏环境、起火、破损、溢出、液体渗漏、放射性渗漏或包装物未能保持完整的其他情况。任何与危险品航空运输有关并严重危及航空器或者机上人员的事件也能被认为构成航空器事故征候"}, {"id": 134, "question": "危险品在空中发生紧急情况时,在时间允许的情况下,机组人员应将机长通知单中危险品信息通知空管和签派", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 135, "question": "未取得危险品航空运输许可的航空公司,不得承运危险品", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 136, "question": "为旅客提供的机上娱乐设备及信用卡读卡机,可不受危险品运输规则限制", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 137, "question": "危险品的应急代码可以在机长通知单上找到", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 138, "question": "危险品货物机长通知单的右上角印有公司的应急电话,但是没有危险品应急代码的相关信息", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 139, "question": "危险品处置措施表应该在下列哪本手册中查找", "options": [["A", "机上危险品事故应急处理指南"], ["B", "危险品运输手册"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 140, "question": "下面哪一项物品中可能含有危险品", "options": [["A", "报刊杂志"], ["B", "服装"], ["C", "野营用具"], ["D", "健康的活体动物"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节野营用具CAMPING EQUIPMENT可能含有易燃气体（丁烷、丙烷等）、易燃液体（煤油、汽油等）易燃固体（乌洛托品、火柴等），或其他危险品"}, {"id": 141, "question": "下列哪些物品中含有危险品？", "options": [["A", "服装"], ["B", "报刊"], ["C", "维修"], ["D", "工具箱"], ["E", "健康的活体动物"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": "根据《危险品运输手册》2.3.2章节工具箱TOOL BOXES可能含爆炸品（射钉枪）、压缩气体或气溶胶、易燃气体（丁烷气瓶或焊枪）、易燃黏合剂或油漆、腐蚀性液体、锂电池等"}, {"id": 142, "question": "下面哪些物品无需承运人的批准，可以作为行李用航空器运输（）", "options": [["A", "雪崩救援背包"], ["B", "节能灯"], ["C", "心脏起搏器"], ["D", "用于机械假肢的气瓶"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": "1.雪崩救援包（允许手提行李中，允许托运，需经承运人同意，无需报告机长）2.节能灯（允许手提行李中，允许托运，无需经承运人同意，无需报告机长）3.植入人体内或外置式放射性同位素心脏起搏器或其他装置（随身携带，无需经承运人同意，无需报告机长）4.用于机械假肢的气瓶（允许手提行李中，允许托运，无需经承运人同意，无需报告机长）"}, {"id": 143, "question": "下列物品不受《危险品运输手册》的限制的是", "options": [["A", "直接取自生病的人体用于疾病诊断的血液"], ["B", "医学培养物"], ["C", "用于移植的血液制品、任何组织或器官"], ["D", "医疗或临床废弃物"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 144, "question": "下列物品不属于危险品：", "options": [["A", "疫苗"], ["B", "干冰"], ["C", "充气篮球"], ["D", "天然矿石"]], "answer": "CD", "type": "选择", "source": "file2_全部", "note": "不受危险品规则限制的物品有碳酸饮料，充气篮球级天然矿石"}, {"id": 145, "question": "下述哪些物品的收运，中国民航局有着更严格的限制和规定？", "options": [["A", "干冰"], ["B", "打火机"], ["C", "白酒"], ["D", "非放射性的药品或生活用品"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 146, "question": "下列物品可以作为托运行李运输的有（）。", "options": [["A", "蓝焰和雪茄打火机"], ["B", "笔记本电脑"], ["C", "便携式电子设备的燃科电地"], ["D", "催泪瓦断"]], "answer": "BC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 147, "question": "吸入、吞服或与皮肤接触危害人体健康的物质是毒性物质", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 148, "question": "需要承营人特殊许可，才可以携带的行李的有（）。", "options": [["A", "野营用具"], ["B", "产生热量的物品"], ["C", "内燃发动机或燃料电池发动机"], ["D", "额定能量为120瓦特／小时的备用锂电池"]], "answer": "AD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 149, "question": "下列危险品哪类需要隔离", "options": [["A", "5.1和4.2"], ["B", "5.1和4.3"], ["C", "1.4s和8"], ["D", "3和7"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "5.1项 氧化性物质POX（例：硝酸铵肥料，漂白剂，双氧水，化学氧气发生器，PBE）4.2项易自然物质RSC（例：白磷。黄磷，二氨基镁）\n"}, {"id": 150, "question": "下列危险品,不属于第九类的是", "options": [["A", "紧急救生滑梯"], ["B", "磁性物质"], ["C", "湿电池"], ["D", "锂电池"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": "第八类《腐蚀性物质》\n例：湿电池，汞，硫酸，含有蓄电池的电动轮椅"}, {"id": 151, "question": "烟花炮竹属于 4.1 项易燃固体.", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "烟花爆竹属于第一类爆炸品"}, {"id": 152, "question": "运输甩动轮椅时地面人员必须通 通过特殊装载机长通知单（行李）向机长通报装载信息，", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "特殊装载机长通知单：\n1.枪支和/或子弹2.政府气象局代表携带的水银温度计或气压计3.电动轮椅或其他电动代步工具及卸下电池（所有电动轮椅必须通知机长装机位置）"}, {"id": 153, "question": "溢出或泄漏的危险品经处置以后，以下流程哪些是正确的", "options": [["A", "无论箱子放在何处，都要将其牢牢固定住以防移动，并使物品保持直立正放"], ["B", "腾空一机上配备的装供应品的箱子"], ["C", "把装有危险物品的袋子放入箱内并盖上盖"], ["D", "将箱子拿到一个离驾驶舱和旅客尽可能远的地方"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 154, "question": "用于机上食品及饮料中的干冰可以装载在飞机客舱内，不受危险品运输规定限制", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "根据公司《危险品运输手册》2.6章节承运人物资（COMAT）中的危险品的规定。承运人物资中的一些物品和物质可能归类为危险物品，安装在飞机上时不受本手册的限制，而作为货物运输时，必须按照危险物品办理运输。"}, {"id": 155, "question": "液氨属于()危险品。", "options": [["A", "2.2项"], ["B", "3类"], ["C", "6.1项"], ["D", "8类"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "液氨属于2.3项毒性气体，其次属于第8类腐蚀性物质"}, {"id": 156, "question": "油漆也属于易燃液体？", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "第三类《易燃液体》\n例：油漆，酒精，某些粘稠剂，丙酮，汽油"}, {"id": 157, "question": "由于危险品发生泄漏，引起客舱内出现大量浓烈烟雾时，客舱乘务员最好给旅客提供湿毛巾（或湿布）防止烟雾吸入", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "/"}, {"id": 158, "question": "有机过氧化物遇热，受到摩擦或碰撞，容易引起热分解，会严重损坏眼睛和皮肤", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "/"}, {"id": 159, "question": "有GHS标签的化学品一定是危险品。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "GHS标签：可能预示着包装件中装有危险品，有些标签表明该物质在供给和使用中有危害；另外一些标签在很大程度上等同于运输中的危险品标签，表明包装件中有危险品"}, {"id": 160, "question": "以下哪些是与危险品运输相关的法律法规？", "options": [["A", "危险货物运输建议——规章范本"], ["B", "放射性物品安全运输规则"], ["C", "中华人民共和国民用航空法"], ["D", "危险化学品安全管理条例"], ["E", "中华人民共和国民用航空安全保卫条例"], ["F", "中国民用航空安全检查规则"]], "answer": "ABCDEF", "type": "选择", "source": "file2_全部", "note": "/"}, {"id": 161, "question": "以下哪些是旅客可以携带的物品？", "options": [["A", "除颤器"], ["B", "雾化器"], ["C", "家庭用节能灯泡"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 162, "question": "以下哪个物品属于爆炸品？", "options": [["A", "遇险信号弹"], ["B", "油漆"], ["C", "氰化钾"], ["D", "超级碳精"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "遇险信号弹属于；油漆属于第三类易燃液体；氰化钾属于6.1项毒性物质；超级炭精属于4.1项易燃固体"}, {"id": 163, "question": "以下哪一种是有机过氧化物？", "options": [["A", "过氧乙酸"], ["B", "过氧化氢"], ["C", "氨基酸"], ["D", "氧气"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": "5.2项 有机过氧化物ROP（例：过氧乙酸）"}, {"id": 164, "question": "以下哪些不属于第 7 类危险品的放射性物质？", "options": [["A", "为了诊断或治疗需要而植入或注入人体或活体动物内的放射性物质"], ["B", "获得管理部门正式批准，通过销售途径到达最终用户的消费品中的放射性物质"], ["C", "含有天然生成的放射性核素的天然材料的矿石"], ["D", "所含放射性核素的活度浓度和该票货物总活度均大于 IATA 《危险品规则》第 10.4.2.1"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 165, "question": "以下哪些可以作为防短路措施？", "options": [["A", "将锂电池分开放在不同的塑料袋中"], ["B", "锂电池的两极使用绝缘帽进行隔离"], ["C", "将使用锂电池放置在同一个包装中"], ["D", "将锂电池与其他导电体放在一起"]], "answer": "AB", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 166, "question": "以下说法，哪些是错误的？", "options": [["A", "每个备用电池都必须做好保护以防短路"], ["B", "装于设备中的电池或备用电池的锂金属或锂合金电池中，锂含量可以超过 2 克"], ["C", "含锂金属或锂离子电池/芯的便携式电子设备可作为手提行李携带，也可作为托运行李"], ["D", "锂电池必须满足 UN 检验标准手册第三部分 38.3 所规定的全部测试要求"]], "answer": "B", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 167, "question": "以下哪个说法是错误的？", "options": [["A", "贴有第 1.1、1.2、1.3、1.4F、1.5 和 1.6 项爆炸品标签的包装件，通常为航空禁运"], ["B", "次要危险性为第 6.1 项的第 8 类危险品，如果其毒性只产生于对组织的破坏作用，则不必"], ["C", "氧化性物质标签底部必须标出“5.1”"], ["D", "如果一种物品具有多重危险性，那么与其危险性相关的所有标签不需要粘贴在包装件上"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 168, "question": "以下属于锂的说法中，哪些是正确的？", "options": [["A", "锂容易与空气发生反应"], ["B", "容易发生反应的金属"], ["C", "外观呈银白色，非常柔软，可伸展，且易燃"], ["D", "锂是易自燃物"]], "answer": "BC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 169, "question": "以下关于 UN38.3 测试的说法中，哪些是正确的？", "options": [["A", "UN38.3 测试需进行气压、温度、湿度等测试"], ["B", "UN38.3 测试需进行颠簸、冲击、撞击等测试"], ["C", "UN38.3 测试是联合国《UN 危险品运输试验和标准手册》第 3 部分 38.3 款的简称"], ["D", "UN38.3 测试是针对蓄电池的测试"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 170, "question": "以下行李中，需要在特殊装载机长通知单（行李）中注明的是（）。", "options": [["A", "装有冷冻液氨的保温包装"], ["B", "政府气象局代表携带的水银温度计或气压计"], ["C", "安全子弹"], ["D", "裘有非防漏电池的电动轮椅"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": "特殊装载机长通知单：\n1.枪支和/或子弹2.政府气象局代表携带的水银温度计或气压计3.电动轮椅或其他电动代步工具及卸下电池（所有电动轮椅必须通知机长装机位置）"}, {"id": 171, "question": "以下物品属于为 6.1 项的危险品为", "options": [["A", "液氮"], ["B", "心脏起搏器"], ["C", "农药"], ["D", "被病毒感染的血液"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": "6.1项 毒性物质RPB（例：砷，尼古丁，氰化物，农药，马钱子碱（老鼠药））"}, {"id": 172, "question": "以下物品和物质中，属于第3类危险品的是（）", "options": [["A", "双氧水"], ["B", "油漆"], ["C", "粘稠剂"], ["D", "酒精"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": "第三类《易燃液体》\n例：油漆，酒精，某些粘稠剂，丙酮，汽油"}, {"id": 173, "question": "以下物品或物质不属于危险品的是（）。", "options": [["A", "充气篮球"], ["B", "干冰"], ["C", "疫苗"], ["D", "天然矿石"]], "answer": "AD", "type": "选择", "source": "file2_全部", "note": "不受危险品规则限制的物品有碳酸饮料，充气篮球及天然矿石"}, {"id": 174, "question": "以下不需要在特殊装载机长通知单中注明的是", "options": [["A", "政府气象局代表携带的水银温度计或气压计"], ["B", "子弹"], ["C", "装有可溢漏电池或锂电池的电动轮椅"], ["D", "含烃类气体的卷发器"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": "特殊装载机长通知单：\n1.枪支和/或子弹2.政府气象局代表携带的水银温度计或气压计3.电动轮椅或其他电动代步工具及卸下电池（所有电动轮椅必须通知机长装机位置）"}, {"id": 175, "question": "以下哪类货物不是特种货物", "options": [["A", "未冲洗的交卷"], ["B", "鲜货易腐货物"], ["C", "湿电池"], ["D", "干冰"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 176, "question": "政府气象局或类似官方机构的代表每人可在手提行李内携带一支水银气压计或水银温度计", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "政府气象局或类似官方机构的代表每人可在手提行李内携带一支水银气压计或水银温度计（可作为手提行李，不允许作为托运行李，需承运人同意，需告知机组位置）"}, {"id": 177, "question": "装有易燃液体的野营炉，其液体被清空后，可以允许旅客作为手提行李带上飞机", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "不可作为手提行李，允许作为托运行李，需承运人同意，无需告知机长"}, {"id": 178, "question": "在处置锂电池机上失火时，以下哪些说法是正确的", "options": [["A", "在处理锂电池装置失火时，不要移动装置，避免人员受伤"], ["B", "可以使用物品覆盖电子设备或试图用冰块降低温度"], ["C", "应考虑断开或除去失火设备上的外接电源"], ["D", "应该使用水灭火器灭火，使起火的电池内的电池芯冷却"]], "answer": "ACD", "type": "选择", "source": "file2_全部", "note": "禁止用冰块、干冰或湿毛毯覆盖的方式对锂电池或锂电池设备进行冷却"}, {"id": 179, "question": "在电池、便携式电子装置（PED)起火、冒烟处置程序中，在将装置放在原位，并监测重新发火现象时，需注意", "options": [["A", "不要使用冰或干冰冷却装置"], ["B", "不要试图拿起或移动装置"], ["C", "不要将装置盖住或对其进行包裹"], ["D", "以上均是"]], "answer": "D", "type": "选择", "source": "file2_全部", "note": "/"}, {"id": 180, "question": "在危险品货物机长通知单中，我们会发现应急措施代号（Drill Code）,此项注明了所运危险品的应急措施代码，通过《机上危险品事故应急处理手册》解码，我们可以得到该物品出现事故时的行动指导", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "/"}, {"id": 181, "question": "在飞行中机组成员发现旅客违规携带的危险品时，应按照《民用航空危险品运输管理规定》的要求及时收缴或代为妥善保管，并放置到安全位置或机上最小风险区", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "/"}, {"id": 182, "question": "作为货物运输的干冰,必须填写<危险品货物机长通知单>,运输作为普通货物制冷剂的干冰,则无需填写<危险品货物机长通知单>", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 183, "question": "在货舱内发生的不安全事故.应在试图打开货舱门前,将旅客和机组人员撤离航空器,货舱门打开时应有应急服务人员在场", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "/"}, {"id": 184, "question": "公司禁止运输按照包装说明965运输的UN3480锂离子电池。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "运输符合IATA《危险品规则》要求的1-9类的危险品中，但不运输：\nG.按照包装说明965运输的UN3480锂离子电池和按照包装说明968运输的UN3090锂金属电池"}, {"id": 185, "question": "公司需取得民航局的危险品航空运输许可并在载明的范围和有效期内开展危险品航空运输活动。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 186, "question": "公司物资(Company Materials)中可能含有哪些危险品？", "options": [["A", "化学氧气发生器"], ["B", "灭火瓶"], ["C", "救生器材"], ["D", "信号弹"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 187, "question": "如下所列危险品中,公司不可以收运的是( )。", "options": [["A", "联合国标准规格包装件"], ["B", "中国始发的非放射性物质的例外包装件"], ["C", "客机航班上的A级感染性物质"], ["D", "含有液体危险品的单一包装"]], "answer": "BCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 188, "question": "部分航空禁运的危险品，如带有通气设施的 B（M）型物质包装件，经过豁免可以运输。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 189, "question": "下列属于托运人责任的有（ ）。", "options": [["A", "包装"], ["B", "分类"], ["C", "识别"], ["D", "标记、标签"]], "answer": "ABCD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 190, "question": "承运人物资中用于机上食品及饮料中的干冰不受危险品规定的限制。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "根据公司《危险品运输手册》2.6章节承运人物资（COMAT）中的危险品的规定。承运人物资中的一些物品和物质可能归类为危险物品，安装在飞机上时不受本手册的限制，而作为货物运输时，必须按照危险物品办理运输。"}, {"id": 191, "question": "在航班上使用及销售的酒精饮料不受危险品规则的限制。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "根据公司《危险品运输手册》2.6章节承运人物资（COMAT）中的危险品的规定。承运人物资中的一些物品和物质可能归类为危险物品，安装在飞机上时不受本手册的限制，而作为货物运输时，必须按照危险物品办理运输。"}, {"id": 192, "question": "航材中的危险品在满足适航条件下，不受危险品相关规定的限制，当作为货物运输时，仍然不受限制。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "根据公司《危险品运输手册》2.6章节承运人物资（COMAT）中的危险品的规定。承运人物资中的一些物品和物质可能归类为危险物品，安装在飞机上时不受本手册的限制，而作为货物运输时，必须按照危险物品办理运输。"}, {"id": 193, "question": "公司可接收含有液体危险品的单一包装（包括复合包装）。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 194, "question": "公司配备机上使用的含有锂金属或锂离子电池的便携式电子设备及备用电池等不受危险品运输规定限制。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": "根据公司《危险品运输手册》2.6章节承运人物资（COMAT）中的危险品的规定。承运人物资中的一些物品和物质可能归类为危险物品，安装在飞机上时不受本手册的限制，而作为货物运输时，必须按照危险物品办理运输。"}, {"id": 195, "question": "危险品是指列在ICAO《技术细则》危险品清单中或者根据ICAO《技术细则》的归类，能对健康、安全、财产或者环境构成危险的物品或者物质。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 196, "question": "交通运输部2024年第4号令是指（ ）。", "options": [["A", "《中华人民共和国民用航空安全保卫条例》"], ["B", "《危险品规则》"], ["C", "《民用航空危险品运输管理规定》"], ["D", "《中国民用航空危险品运输管理规定》"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 197, "question": "带有通气设施的B（M）型物质包装件在任何情况下都禁止航空运输。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 198, "question": "危险品包装件上的标记包括（ ）。", "options": [["A", "运输专用名称"], ["B", "UN/ID 代号"], ["C", "收、发货人姓名地址"], ["D", "杂项危险物质和物品标签"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 199, "question": "磁性物质的外包装件必须贴上第9类危险性标签。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 200, "question": "下列物品中属于第9类杂项危险物质和物品的是（ ）。", "options": [["A", "石棉"], ["B", "磁性物质"], ["C", "汽车"], ["D", "湿电池"]], "answer": "ABC", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 201, "question": "干扰飞机导航系统的物质是磁性物质，属于第8类危险品。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": "磁性物质为第9类的危险品"}, {"id": 202, "question": "锂电池驱动的电动轮椅，若电池拆下在客舱中运输，其锂电池允许的最大额定能量为（ ）。", "options": [["A", "160Wh"], ["B", "100Wh"], ["C", "300Wh"], ["D", "150Wh"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 203, "question": "乘机登记人员在收运弹药时，应要求旅客出示书面证明，该证明应由国家规定的枪支弹药管理部门出具，确认证明文件齐备后方可为旅客办理收运手续。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 204, "question": "行李中允许的便携式电子设备中的锂电池，其单块锂电池的额定能量上限是300Wh。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 205, "question": "旅客和机组个人自用的含有锂电池的电子香烟仅限在手提行李中携带。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 206, "question": "旅客的托运行李中含有作为非危险品的制冷剂干冰时，应在行李上标注“干冰”字样。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 207, "question": "含有放射性物质的心脏起搏器，且由锂电池驱动，可以作为托运行李、手提行李、随身携带的方式携带。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 208, "question": "雪崩救援包内可能含有2.2项压缩气体", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 209, "question": "含有超过100Wh但不超过160Wh的锂离子电池的设备，不需要经过航空公司批准也可作为托运行李或手提行李运输。", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 210, "question": "关于锂电池驱动轮椅的携带规定，以下说法中正确的是（ ）", "options": [["A", "旅客最多可携带2块不超过160Wh和1块不超过300Wh的备用电池"], ["B", "锂电池额定能量不超过100Wh时，不需要承运人批准"], ["C", "从轮椅上拆卸的锂电池必须客舱中运输"], ["D", "轮椅上拆下的锂电池不能超过300Wh才可以运输"]], "answer": "CD", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 211, "question": "若旅客乘坐公司航班只携带了南孚5号电池这一种备用电池，那么他最多可以携带（ ）块，超过应通知公司，经公司同意后方可运输", "options": [["A", "2"], ["B", "15"], ["C", "20"], ["D", "8"]], "answer": "C", "type": "选择", "source": "file2_全部", "note": "南孚电池为干电池，属于备用电池"}, {"id": 212, "question": "如果一块锂电池标称电压为4.2V，额定容量为1000mAh，那么该锂电池的额定能量是4200Wh", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 213, "question": "作为旅客行李运输的备用锂电池，可以作为托运行李运输", "options": [["A", "√"], ["B", "×"]], "answer": "B", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 214, "question": "备用锂电池，为保证安全运输，必须单个包装加以保护。", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 215, "question": "如果一块锂电池标称电压V=4.2V，容量为1000mAh，那么该锂电池的额定能量是( )Wh", "options": [["A", "4.2"], ["B", "42"], ["C", "420"], ["D", "4200"]], "answer": "A", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 216, "question": "植入人体内或外置式放射性同位素心脏起搏器或其他装置（包括以锂电池为动力装置的心脏起搏器），不能作为（ ）方式携带。", "options": [["A", "托运行李"], ["B", "手提行李"], ["C", "随身携带"]], "answer": "AB", "type": "选择", "source": "file2_全部", "note": ""}, {"id": 217, "question": "锂离子电池驱动的便携式电子设备，如相机、手机、平板电脑等，当旅客或机组人员用于个人使用时，可以作为托运行李运输：但必须采取措施以防设备损伤或意外启动；设备完全关闭（不能为睡眠或者休眠模式），除非内装的锂离子电池容量不超过2.7Wh", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 218, "question": "含有爆炸品、压缩气体、锂电池等危险品的电击武器（如泰瑟枪），禁止在手提，托运和随身行李中携带", "options": [["A", "√"], ["B", "×"]], "answer": "A", "type": "判断", "source": "file2_全部", "note": ""}, {"id": 219, "question": "以下属于危险品航空运输事件的是（ ）", "options": [["A", "危险品征候"], ["B", "危险品事故"], ["C", "危险品一般事件"], ["D", "以上都是"]], : 303}, {"question": "备用锂电池如果额定瓦特小时超过100Wh但不超过160Wh，必须如何？", "options": [["A", "直接携带，不需同意"], ["B", "经承运人同意并有书面批准方可携带"], ["C", "禁止携带"], ["D", "只能托运"]], "answer": "B", "type": "选择", "source": "知识点补充", "note": "", "id": 304}, {"question": "装有锂电池且电池可拆卸的行李箱，若作为托运行李必须如何？", "options": [["A", "整箱托运即可"], ["B", "将电池拆卸后手提进入客舱，拆下电池的行李箱作为托运行李"], ["C", "禁止托运"], ["D", "需提前24小时申请"]], "answer": "B", "type": "选择", "source": "知识点补充", "note": "", "id": 305}];</script>

<body>
<header>
  <div>
    <h1>✈️ 危险品知识题库</h1>
    <div class="sub">国航危险品运输知识 · 在线练习与错题本</div>
  </div>
  <div id="dbg" style="margin:8px 0;padding:8px 3px;font-size:12px;color:#b45309">⏳ 脚本检测中…</div>
  <div class="userbox"><span style="opacity:.9;font-size:12px">📱 错题本保存在当前浏览器 · 无需登录</span></div>
</header>

<div class="container">
  <!-- 登录/注册 -->
  <div id="authView" style="display:none">
    <div class="auth-wrap">
      <div class="auth-card">
        <h2 id="authTitle">登 录</h2>
        <p id="authSub">已有账号请登录，新用户可直接注册</p>
        <div class="field"><label>用户名</label><input id="aUser" autocomplete="username"></div>
        <div class="field"><label>密码</label><input id="aPass" type="password" autocomplete="current-password"></div>
        <button class="btn-main" id="authBtn" onclick="doAuth()">登 录</button>
        <div class="msg" id="authMsg"></div>
        <div class="link" id="toggleAuth" onclick="toggleAuth()">没有账号？去注册</div>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView">
    <div class="tabs">
      <div class="tab active" data-tab="practice" onclick="switchTab('practice')">📝 练习</div>
      <div class="tab" data-tab="wrong" onclick="switchTab('wrong')">📕 错题本<span class="badge" id="wrongBadge" style="display:none">0</span></div>
      <div class="tab" data-tab="stats" onclick="switchTab('stats')">📊 我的成绩</div>
    </div>

    <!-- 练习 -->
    <div id="view-practice">
      <div class="card" id="setupCard">
        <div id="scoreBox" class="card" style="display:none;margin-bottom:14px;border-color:#fbbf24"></div>
        <div class="sec-title">选择练习方式</div>
        <div class="setup-row" id="modeRow">
          <div class="mode-chip active" data-mode="mixed" onclick="setMode(this)">全部混合</div>
          <div class="mode-chip" data-mode="judge" onclick="setMode(this)">判断题</div>
          <div class="mode-chip" data-mode="choice" onclick="setMode(this)">选择题</div>
        </div>
        <div class="setup-row">
          <span style="align-self:center;font-size:14px;color:var(--muted)">快速练习（不计分）：<input class="sel-count" id="countInput" type="number" min="1" value="10"> 题</span>
        </div>
        <button class="btn primary" <button class="btn primary" onclick="startQuiz('exam')">📋 开始考试｜50题·每题2分·80分及格</button>
        <button class="btn ghost" onclick="startQuiz('practice')">✏️ 快速练习</button>
        <div style="margin-top:10px;font-size:13px;color:var(--muted)" id="bankInfo">题库加载中…</div>
      </div>
      <div class="card" id="quizCard" style="display:none">
        <div class="qmeta">
          <div id="qtype"></div>
          <div class="progress" id="qprogress"></div>
        </div>
        <div class="qtext" id="qtext"></div>
        <div id="qopts"></div>
        <div id="qresult"></div>
        <div class="actions" id="qactions"></div>
      </div>
    </div>

    <!-- 错题本 -->
    <div id="view-wrong" style="display:none">
      <div class="card">
        <div class="sec-title">📕 错题本 <span id="wrongTotal" style="font-size:13px;color:var(--muted)"></span></div>
        <div id="wrongList"></div>
      </div>
    </div>

    <!-- 统计 -->
    <div id="view-stats" style="display:none">
      <div class="card">
        <div class="sec-title">📊 我的成绩</div>
        <div class="stat-grid" id="statGrid"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
(function(){
  // ---------- 本地存储：错题本 + 答题记录 ----------
  var LS_KEY = 'hazard_quiz_data_v1';
  var __mem=null;
  function load(){ if(__mem)return __mem; try{ var __d=JSON.parse(localStorage.getItem(LS_KEY)); if(__d&&__d.wrong)return __d; }catch(e){} return {wrong:[],records:[]}; }
  function save(d){ __mem=d; try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){ /* iOS本地文件打开时 localStorage 不可用，仅内存保存 */ } }
  var DB = load();
  function wrongSet(){ return DB.wrong.slice(); }

  // ---------- 题库索引 ----------
  var BYID={}; BANK.forEach(function(b){BYID[b.id]=b;});

  // ---------- 工具 ----------
  function $(id){ return document.getElementById(id); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }

  // ---------- 模式 ----------
  var MODE='mixed';
  function setMode(el){ document.querySelectorAll('.mode-chip').forEach(function(c){c.classList.remove('active');}); el.classList.add('active'); MODE=el.dataset.mode; }
  function _setBankInfo(){
    var j=BANK.filter(function(b){return b.type==='判断';}).length;
    var c=BANK.filter(function(b){return b.type==='选择';}).length;
    $('bankInfo').textContent='题库共 '+BANK.length+' 题（判断题 '+j+' 题 · 选择题 '+c+' 题） · 错题本保存在当前浏览器';
  }

  // ---------- 练习 ----------
  var quiz={questions:[],idx:0,submitted:false,isExam:false,correct:0};
  function startQuiz(type){
    var isExam = type==='exam';
    var pool=BANK.slice();
    if(!isExam){
      if(MODE==='judge')pool=pool.filter(function(b){return b.type==='判断';});
      if(MODE==='choice')pool=pool.filter(function(b){return b.type==='选择';});
    }
    // 洗牌
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    var count = isExam ? 50 : (parseInt($('countInput').value)||10);
    var sb=$('scoreBox'); if(sb)sb.style.display='none';
    quiz={questions:pool.slice(0,count),idx:0,submitted:false,isExam:isExam,correct:0};
    $('setupCard').style.display='none';
    $('quizCard').style.display='block';
    renderQ();
  }
  function renderQ(){
    var q=quiz.questions[quiz.idx]; quiz.submitted=false;
    $('qtype').innerHTML = q.type==='判断' ? '<span class="qbadge judge">判断题</span>' : '<span class="qbadge choice">选择题</span>';
    $('qprogress').textContent='第 '+(quiz.idx+1)+' / '+quiz.questions.length+' 题';
    $('qtext').textContent=q.question;
    $('qresult').innerHTML='';
    $('qopts').innerHTML = q.options.map(function(o,i){
      return '<div class="opt" data-k="'+o[0]+'"><label><input type="checkbox" name="opt" value="'+o[0]+'"><span><b>'+o[0]+'.</b> '+esc(o[1])+'</span></label></div>';
    }).join('');
    $('qactions').innerHTML='<button class="btn primary" onclick="window.__submitQ()">提交答案</button>';
  }
  function pickedQ(){ return Array.prototype.map.call(document.querySelectorAll('#qopts input[name=opt]:checked'),function(i){return i.value;}); }
  function submitQ(){
    var q=quiz.questions[quiz.idx]; var sels=pickedQ();
    if(!sels.length){ toast('请先选择答案'); return; }
    sels.sort(); var picked=sels.join(''); var correct=(picked===q.answer);
    // 更新错题本
    var wi=DB.wrong.indexOf(q.id);
    if(correct){ if(wi>=0)DB.wrong.splice(wi,1); quiz.correct++; }
    else { if(wi<0)DB.wrong.push(q.id); }
    DB.records.push({qid:q.id,correct:correct,at:new Date().toLocaleString()});
    save(DB); refreshBadge();
    // 展示结果
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),function(o){
      var k=o.dataset.k;
      if(q.answer.indexOf(k)>=0)o.classList.add('correct');
      else if(sels.indexOf(k)>=0)o.classList.add('wrong');
    });
    var rb=$('qresult');
    rb.className='result-box '+(correct?'correct':'wrong');
    var html = correct ? '<b>✅ 回答正确！</b>'+(wi>=0?'（已自动移出错题本）':'') : '<b>❌ 回答错误</b> 正确答案：<b>'+q.answer+'</b>';
    if(q.note) html+='<br>📌 '+esc(q.note);
    rb.innerHTML=html;
    var more = quiz.idx < quiz.questions.length-1;
    $('qactions').innerHTML = more
      ? '<button class="btn primary" onclick="window.__nextQ()">下一题 →</button>'
      : '<button class="btn primary" onclick="window.__finish()">完成练习 🎉</button>';
  }
  function nextQ(){ quiz.idx++; renderQ(); }
  function finish(){
    $('quizCard').style.display='none'; $('setupCard').style.display='block';
    var total=quiz.questions.length, got=quiz.correct||0;
    var score=got*2, full=total*2, sb=$('scoreBox');
    if(sb){
      sb.style.display='block';
      if(quiz.isExam){
        var pass = score>=80;
        DB.scores=DB.scores||[];
        DB.scores.push({date:new Date().toLocaleString(),total:total,got:got,score:score,pass:pass});
        save(DB);
        sb.innerHTML='<div class="sec-title">📋 考试结果（第'+DB.scores.length+'场 · 每题2分 · 满分'+full+'分）</div>'
          +'<div class="stat-grid">'
          +'<div class="stat"><div class="num">'+score+'</div><div class="lbl">得分 / '+full+'</div></div>'
          +'<div class="stat"><div class="num">'+got+'</div><div class="lbl">答对 '+total+' 题</div></div>'
          +'<div class="stat"><div class="num">'+Math.round(got/total*100)+'%</div><div class="lbl">正确率</div></div>'
          +'<div class="stat"><div class="num" style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+(pass?'及格 ✓':'未及格 ✗')+'</div><div class="lbl">80分及格线</div></div>'
          +'</div>';
      } else {
        sb.innerHTML='<div class="sec-title">✏️ 快速练习结果</div><p style="font-size:15px">本场共 '+total+' 题，答对 '+got+' 题。</p>';
      }
      try{sb.scrollIntoView({behavior:'smooth'});}catch(e){sb.scrollIntoView();}
    }
    refreshBadge(); _setBankInfo(); loadStats();
  }

  // ---------- 错题本 ----------
  function refreshBadge(){ $('wrongBadge').style.display = DB.wrong.length?'inline-block':'none'; $('wrongBadge').textContent=DB.wrong.length; }
  function switchTab(tab){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('active',t.dataset.tab===tab);});
    ['practice','wrong','stats'].forEach(function(v){ $('view-'+v).style.display=(v===tab)?'block':'none'; });
    if(tab==='wrong')loadWrong();
    if(tab==='stats')loadStats();
  }
  function loadWrong(){
    var list=DB.wrong.map(function(id){return BYID[id];}).filter(Boolean);
    $('wrongTotal').textContent='共 '+list.length+' 题';
    var box=$('wrongList');
    if(!list.length){ box.innerHTML='<div class="empty">🎉 太棒了，暂时没有错题</div>'; return; }
    box.innerHTML=list.map(function(q){
      return '<div class="wrong-item" id="wi-'+q.id+'">'
        +'<div class="wmeta">'+(q.type==='判断'?'判断题':'选择题')+' · 答对后自动移出</div>'
        +'<div class="wq">'+esc(q.question)+'</div>'
        +'<div id="wopts-'+q.id+'"></div><div id="wres-'+q.id+'"></div>'
        +'<button class="btn primary" id="wbtn-'+q.id+'" onclick="window.__retry('+q.id+')">重新作答</button>'
        +'</div>';
    }).join('');
  }
  function retry(qid){
    var q=BYID[qid]; var box=$('wopts-'+qid);
    box.innerHTML=q.options.map(function(o){ return '<div class="opt" data-k="'+o[0]+'" style="margin:6px 0"><label><input type="checkbox" name="wopt-'+qid+'" value="'+o[0]+'"><span><b>'+o[0]+'.</b> '+esc(o[1])+'</span></label></div>'; }).join('');
    $('wbtn-'+qid).textContent='提交重答';
    $('wbtn-'+qid).onclick=function(){ submitRetry(qid); };
  }
  function submitRetry(qid){
    var q=BYID[qid];
    var sels=Array.prototype.map.call(document.querySelectorAll('input[name=wopt-'+qid+']:checked'),function(i){return i.value;});
    if(!sels.length){ toast('请先选择答案'); return; }
    sels.sort(); var correct=(sels.join('')===q.answer);
    var res=$('wres-'+qid);
    res.className='result-box '+(correct?'correct':'wrong');
    res.innerHTML = correct ? '<b>✅ 正确！已从错题本移除 🎉</b>'+(q.note?'<br>📌 '+esc(q.note):'') : '<b>❌ 错误</b> 正确答案：<b>'+q.answer+'</b>'+(q.note?'<br>📌 '+esc(q.note):'');
    $('wbtn-'+qid).style.display='none';
    if(correct){
      var i=DB.wrong.indexOf(qid); if(i>=0)DB.wrong.splice(i,1);
      save(DB); refreshBadge(); loadWrong();
      setTimeout(function(){ var el=$('wi-'+qid); if(el)el.remove(); },1200);
    }
  }

  // ---------- 统计 ----------
  function loadStats(){
    var recs=DB.records||[];
    var total=recs.length;
    var correct=recs.filter(function(r){return r.correct;}).length;
    var rate= total? (correct/total*100).toFixed(1) : 0;
    $('statGrid').innerHTML =
      '<div class="stat"><div class="num">'+total+'</div><div class="lbl">累计练习次数<br>（题次）</div></div>'
      +'<div class="stat"><div class="num">'+correct+'</div><div class="lbl">答对题数</div></div>'
      +'<div class="stat"><div class="num">'+(total-correct)+'</div><div class="lbl">答错题数</div></div>'
      +'<div class="stat"><div class="num">'+rate+'%</div><div class="lbl">正确率</div></div>'
      +'<div class="stat"><div class="num">'+DB.wrong.length+'</div><div class="lbl">当前错题本</div></div>';
    var scores=(DB.scores||[]).slice().reverse().slice(0,10);
    var sh='<div style="grid-column:1/-1;margin-top:6px"><b style="font-size:15px">📜 历史考试成绩</b></div>';
    if(!scores.length){ sh+='<div style="grid-column:1/-1;color:var(--muted);font-size:14px">还没有考试记录，点“开始考试”完成第一场。</div>'; }
    else { scores.forEach(function(s){ sh+='<div style="grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px"><span>'+s.date+'</span><span><b>'+s.score+'分</b>（答对'+s.got+'/'+s.total+'）<span style="color:'+(s.pass?'var(--ok)':'var(--bad)')+'">'+(s.pass?'及格':'未及格')+'</span></span></div>'; }); }
    document.getElementById('statGrid').innerHTML += sh;
  }

  // ---------- 暴露全局 ----------
  window.__submitQ=submitQ; window.__nextQ=nextQ; window.__finish=finish; window.__retry=retry;
  window.setMode=setMode; window.startQuiz=startQuiz; window.switchTab=switchTab;

  // ---------- init ----------
  document.addEventListener('DOMContentLoaded',function(){
    _setBankInfo(); refreshBadge(); switchTab('practice');
  });
  _setBankInfo(); refreshBadge();
})();
</script>
</body>
</html>
